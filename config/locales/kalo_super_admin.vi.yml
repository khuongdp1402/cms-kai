      tiktok:
        description: Trò chuyện với khách qua TikTok.
      whatsapp:
        description: Quản lý tin nhắn WhatsApp Business ngay trong %{brand}.
      telegram:
        description: Quản lý tin nhắn Telegram ngay trong %{brand}.
      line:
        description: Quản lý tin nhắn Line ngay trong %{brand}.
      google:
        description: Cấu hình đăng nhập Google OAuth.
      microsoft:
        description: Cấu hình email Microsoft.
