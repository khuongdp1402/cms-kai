        SuperAdmin: Quản trị hệ thống
    kalo_features:
      title: Chức năng
      intro: Bật hoặc tắt từng nhóm chức năng cho shop này. Tắt chỉ ẩn khỏi giao diện, dữ liệu và API vẫn giữ nguyên.
      submit: Lưu chức năng
      saved: Đã lưu chức năng của shop.
      groups:
        core: Chức năng chính (bật sẵn cho shop mới)
        advanced: Chức năng nâng cao (ẩn với shop mới)
      flags:
        kalo_comments:
          name: Bình luận
          description: Gom bình luận Facebook/Instagram, ẩn bình luận xấu và trả lời riêng.
        kalo_campaigns:
          name: Chiến dịch
          description: Gửi chiến dịch nhắn tin theo từng bước và đo doanh thu.
        kalo_brand:
          name: Thương hiệu
          description: Hồ sơ thương hiệu, lịch nội dung và ý tưởng bằng AI.
        kalo_ai_assistant:
          name: Trợ lý AI
          description: Trợ lý trả lời câu hỏi về cách dùng và số liệu của shop.
        kalo_pos:
          name: Bán hàng tại quầy (POS)
          description: Màn bán hàng tại quầy, tạo đơn và thu tiền nhanh.
        kalo_advanced_automation:
          name: Thao tác nâng cao
          description: Tự động hóa, macro, thuộc tính tùy chỉnh, bot, webhook và ứng dụng dashboard.
        kalo_help_center:
          name: Trung tâm trợ giúp
          description: Viết bài hướng dẫn và đăng lên trang trợ giúp của shop.
        kalo_detailed_reports:
          name: Báo cáo chi tiết
          description: Báo cáo theo nhân viên, nhãn, nhóm, hộp thư và khảo sát hài lòng (CSAT).
        kalo_extra_channels:
          name: Kênh bổ sung
          description: SMS, Email, API, Telegram, Line, WhatsApp và Zalo OA bằng token.
        kalo_auto_posting:
          name: Tự đăng bài
          description: Lên lịch bài, duyệt và tự đăng lên Fanpage Facebook đúng giờ.
    account_actions:
      seed_intro: Tạo dữ liệu mẫu trong tài khoản này để demo.
      seed_warning: "Lưu ý: toàn bộ dữ liệu hiện có của tài khoản sẽ bị xóa."
      seed_submit: Tạo dữ liệu mẫu
      reset_cache_intro: Xóa khóa bộ nhớ đệm IndexedDB trong Redis.
      reset_cache_next: Lần tải sau sẽ lấy lại dữ liệu từ máy chủ.
      reset_cache_submit: Xóa bộ nhớ đệm giao diện
    impersonate:
      caution: "Lưu ý: mọi thao tác sau khi đăng nhập thay sẽ được ghi nhận như do người dùng này thực hiện - [%{name}]"
      submit: Đăng nhập với tư cách người dùng
    app_config:
      title: "Cấu hình - %{name}"
      submit: Lưu
      'true': Bật
      'false': Tắt
      groups:
        general: Chung
        email: Email
        facebook: Facebook
        instagram: Instagram
        tiktok: TikTok
        google: Google
        microsoft: Microsoft
        linear: Linear
        notion: Notion
        slack: Slack
        whatsapp_embedded: WhatsApp nhúng
        shopify: Shopify
        captain: Captain
      fields:
        ENABLE_ACCOUNT_SIGNUP:
          label: Cho phép tự đăng ký tài khoản
          description: Người dùng mới tự tạo được tài khoản shop
        FIREBASE_PROJECT_ID:
          label: Mã dự án Firebase
          description: Mã dự án Firebase (Project ID)
        FIREBASE_CREDENTIALS:
          label: Thông tin xác thực Firebase
          description: Nội dung file JSON thông tin xác thực Firebase
        WEBHOOK_TIMEOUT:
          label: Thời gian chờ webhook (giây)
          description: Thời gian tối đa chờ webhook phản hồi trước khi báo lỗi
        MAXIMUM_FILE_UPLOAD_SIZE:
          label: Dung lượng tệp đính kèm tối đa (MB)
          description: Dung lượng tối đa của mỗi tệp tải lên, tính bằng MB
        WIDGET_TOKEN_EXPIRY:
          label: Hạn mã khung chat website
          description: Số ngày mã của khung chat website còn hiệu lực
        MAILER_INBOUND_EMAIL_DOMAIN:
          label: Tên miền nhận email
          description: Tên miền dùng để tạo địa chỉ trả lời nối tiếp hội thoại (reply+id@tenmien.com)
        ACCOUNT_EMAILS_LIMIT:
          label: Giới hạn email mỗi ngày của tài khoản
          description: Số email (ngoài kênh email) tối đa một tài khoản được gửi mỗi ngày
        ACCOUNT_EMAILS_PLAN_LIMITS:
          label: Giới hạn email theo gói (mỗi ngày)
          description: Giới hạn gửi email mỗi ngày theo từng gói, dạng JSON
        FB_APP_ID:
          label: Mã ứng dụng Facebook (App ID)
        FB_VERIFY_TOKEN:
          label: Mã xác minh Facebook
          description: Mã xác minh dùng cho webhook Facebook Messenger
        FB_APP_SECRET:
          label: Khóa bí mật ứng dụng Facebook
        IG_VERIFY_TOKEN:
          label: Mã xác minh Instagram
          description: Mã xác minh dùng cho webhook Instagram
        FACEBOOK_API_VERSION:
          label: Phiên bản API Facebook
          description: Chỉ đổi khi cần dùng phiên bản API Facebook khác. Phiên bản bắt đầu bằng chữ `v`
        ENABLE_MESSENGER_CHANNEL_HUMAN_AGENT:
          label: Bật chế độ nhân viên trả lời (Messenger)
          description: "Cho phép trả lời khách trên Messenger trong thời gian dài hơn. Cần Meta duyệt thêm: https://developers.facebook.com/docs/features-reference/human-agent/"
        INSTAGRAM_APP_ID:
          label: Mã ứng dụng Instagram (App ID)
        INSTAGRAM_APP_SECRET:
          label: Khóa bí mật ứng dụng Instagram
          description: Khóa bí mật dùng để xác thực Instagram
        INSTAGRAM_VERIFY_TOKEN:
          label: Mã xác minh Instagram
          description: Mã xác minh dùng cho webhook Instagram
        INSTAGRAM_API_VERSION:
          label: Phiên bản API Instagram
          description: Chỉ đổi khi cần dùng phiên bản API Instagram khác. Phiên bản bắt đầu bằng chữ `v`
        ENABLE_INSTAGRAM_CHANNEL_HUMAN_AGENT:
          label: Bật chế độ nhân viên trả lời (Instagram)
          description: "Cho phép trả lời khách trên Instagram trong thời gian dài hơn. Cần Meta duyệt thêm: https://developers.facebook.com/docs/features-reference/human-agent/"
        TIKTOK_APP_ID:
          label: Mã ứng dụng TikTok (App ID)
        TIKTOK_APP_SECRET:
          label: Khóa bí mật ứng dụng TikTok
        TIKTOK_API_VERSION:
          label: Phiên bản API TikTok
          description: Chỉ đổi khi cần dùng phiên bản API TikTok khác. Phiên bản bắt đầu bằng chữ `v`
        GOOGLE_OAUTH_CLIENT_ID:
          label: Google OAuth Client ID
          description: Client ID của Google OAuth dùng để xác thực email
        GOOGLE_OAUTH_CLIENT_SECRET:
          label: Google OAuth Client Secret
          description: Client Secret của Google OAuth dùng để xác thực email
        GOOGLE_OAUTH_REDIRECT_URI:
          label: Google OAuth Redirect URI
          description: Địa chỉ chuyển hướng đã khai báo trong ứng dụng Google OAuth
        ENABLE_GOOGLE_OAUTH_LOGIN:
          label: Cho phép đăng nhập bằng Google
          description: Hiện nút đăng nhập bằng Google khi đã cấu hình thông tin xác thực
        AZURE_APP_ID:
          label: Mã ứng dụng Azure (App ID)
          description: Mã ứng dụng dùng để xác thực tài khoản Microsoft của khách. Hướng dẫn cài Azure https://chwt.app/dev/ms
        AZURE_APP_SECRET:
          label: Khóa bí mật ứng dụng Azure
        LINEAR_CLIENT_ID:
          label: Linear Client ID
          description: Client ID của Linear
        LINEAR_CLIENT_SECRET:
          label: Linear Client Secret
          description: Client Secret của Linear
        NOTION_CLIENT_ID:
          label: Notion Client ID
          description: Client ID của Notion
        NOTION_CLIENT_SECRET:
          label: Notion Client Secret
          description: Client Secret của Notion
        SLACK_CLIENT_ID:
          label: Slack Client ID
          description: Client ID của Slack
        SLACK_CLIENT_SECRET:
          label: Slack Client Secret
          description: Client Secret của Slack
        WHATSAPP_APP_ID:
          label: Mã ứng dụng WhatsApp (App ID)
          description: Mã ứng dụng Facebook dùng cho WhatsApp Business API
        WHATSAPP_APP_SECRET:
          label: Khóa bí mật ứng dụng WhatsApp
          description: Khóa bí mật cho luồng đăng ký WhatsApp nhúng (bắt buộc)
        WHATSAPP_CONFIGURATION_ID:
          label: Mã cấu hình WhatsApp
          description: Mã cấu hình cho luồng đăng ký WhatsApp nhúng (bắt buộc)
        WHATSAPP_API_VERSION:
          label: Phiên bản API WhatsApp
          description: Chỉ đổi khi cần dùng phiên bản API WhatsApp khác. Phiên bản bắt đầu bằng chữ `v`
        SHOPIFY_CLIENT_ID:
          label: Shopify Client ID
          description: Client ID (API Key) trong tài khoản Shopify Partner
        SHOPIFY_CLIENT_SECRET:
          label: Shopify Client Secret
          description: Client Secret (API Secret Key) trong tài khoản Shopify Partner
    features:
      help_center:
