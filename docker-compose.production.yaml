# Kalo production stack. Usage (see docs/reference/deploy.md):
#   docker compose -f docker-compose.production.yaml --env-file .env.production up -d
# Only nginx publishes ports. Required variables fail loudly with ${VAR:?} when missing.
name: kalo

x-rails-env: &rails_env
  NODE_ENV: production
  RAILS_ENV: production
  INSTALLATION_ENV: docker
  INSTALLATION_NAME: ${INSTALLATION_NAME:?}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}
  FRONTEND_URL: ${FRONTEND_URL:?}
  FORCE_SSL: 'true'
  ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:?}
  POSTGRES_USERNAME: ${POSTGRES_USERNAME:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
  CASSO_SECURE_TOKEN: ${CASSO_SECURE_TOKEN:?}
  CASSO_BANK_NAME: ${CASSO_BANK_NAME:?}
  CASSO_ACCOUNT_NUMBER: ${CASSO_ACCOUNT_NUMBER:?}
  CASSO_ACCOUNT_NAME: ${CASSO_ACCOUNT_NAME:?}
  AGENTGW_BASE_URL: ${AGENTGW_BASE_URL:?}
  AGENTGW_API_KEY: ${AGENTGW_API_KEY:?}
  ZALO_PERSONAL_BRIDGE_URL: http://zalo_personal_bridge:5001
  ZALO_BRIDGE_SERVICE_SECRET: ${ZALO_BRIDGE_SERVICE_SECRET:?}
  ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:?}
  MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:?}
  SMTP_DOMAIN: ${SMTP_DOMAIN:?}
  SMTP_ADDRESS: ${SMTP_ADDRESS:?}
  SMTP_PORT: ${SMTP_PORT:?}
  SMTP_USERNAME: ${SMTP_USERNAME:?}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?}
  SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-login}
  SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}

x-rails: &rails
  build:
    context: .
    dockerfile: ./docker/Dockerfile
  image: ${KALO_IMAGE:-kalo-rails:latest}
  restart: unless-stopped
  networks: [internal]
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *rails
    environment:
      <<: *rails_env
      RAILS_SERVE_STATIC_FILES: 'true'
    entrypoint: docker/entrypoints/rails-prod.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zalo_personal_bridge:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'ruby', '-rnet/http', '-e', 'exit(Net::HTTP.get_response(URI("http://127.0.0.1:3000/health")).is_a?(Net::HTTPSuccess) ? 0 : 1)']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  sidekiq:
    <<: *rails
    environment: *rails_env
    entrypoint: docker/entrypoints/rails-prod.sh
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f sidekiq > /dev/null']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  zalo_personal_bridge:
    build:
      context: ./zalo-personal-bridge
    image: ${KALO_BRIDGE_IMAGE:-kalo-zalo-bridge:latest}
    restart: unless-stopped
    networks: [internal]
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USERNAME:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DATABASE:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      CHATWOOT_WEBHOOK_URL: http://rails:3000/webhooks/zalo_personal
      ZALO_BRIDGE_SERVICE_SECRET: ${ZALO_BRIDGE_SERVICE_SECRET:?}
      ZALO_BRIDGE_ACTIVE_KEY_ID: ${ZALO_BRIDGE_ACTIVE_KEY_ID:?}
      ZALO_BRIDGE_ENCRYPTION_KEYS: ${ZALO_BRIDGE_ENCRYPTION_KEYS:?}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:?}
      POSTGRES_USER: ${POSTGRES_USERNAME:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [internal]
    ports:
      - '80:80'
      - '443:443'
    environment:
      KALO_DOMAIN: ${KALO_DOMAIN:?}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./landing-page:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      rails:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz | grep -q ok']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  internal:

volumes:
  storage_data:
  postgres_data:
  redis_data:
