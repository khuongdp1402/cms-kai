apiVersion: v1
kind: Secret
metadata:
  name: zalo-personal-bridge-secrets
  namespace: chatwoot
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:password@postgres:5432/chatwoot"
  REDIS_URL: "redis://:password@redis:6379"
  ZALO_BRIDGE_SERVICE_SECRET: "change_me_to_a_secure_random_32_byte_secret"
  ZALO_BRIDGE_ENCRYPTION_KEYS: '{"k1":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}'
